name: Build Cinode APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Find generated APK
        run: |
          echo "Searching APK..."
          find android -type f -name "*.apk"

      - name: Create release folder
        run: mkdir -p release

      - name: Copy APK (auto-detect, no path errors)
        run: |
          APK_PATH=$(find android -type f -name "*release*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release/Cinode.apk

      - name: Upload Cinode APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinode
          path: release/Cinode.apk
