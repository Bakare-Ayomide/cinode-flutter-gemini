name: Build Cinode Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node (Capacitor requires Node 22+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build web app (Vite → dist/)
      - name: Build web app
        run: npm run build

      # 5. Install Capacitor Assets tool (fix icon issue)
      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      # 6. Generate native icons + splash
      - name: Generate Capacitor Assets
        run: npx capacitor-assets generate

      # 7. Sync Capacitor to Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Setup Java for Android build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 9. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 10. Build DEBUG APK (MOST STABLE FOR INSTALLATION)
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 11. Show build outputs (debugging safety)
      - name: List APK outputs
        run: |
          find android/app/build/outputs -type f

      # 12. Package APK with clean name
      - name: Prepare Cinode APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Cinode.apk

      # 13. Upload APK artifact
      - name: Upload Cinode APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinode
          path: release/Cinode.apk
