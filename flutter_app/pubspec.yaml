name: cinode
description: A movie/TV streaming app with editorial design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.0.0
  intl: ^0.19.0
  video_player: ^2.8.2
  chewie: ^1.7.1
  path_provider: ^2.1.2
  picture_in_picture: ^0.0.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
